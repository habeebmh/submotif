name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Configure portable engine
        run: cmake -S . -B build-core -DUNDERTOW_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build portable engine
        run: cmake --build build-core --parallel 2

      - name: Test portable engine
        run: ctest --test-dir build-core --output-on-failure

      - name: Test Max engine and integration logic
        run: node tests/max-tests.js

      - name: Compare both generation engines
        run: python3 tests/generation-parity.py --compiler g++

      - name: Validate repository setup requests
        run: python3 -B tests/setup-github-tests.py
