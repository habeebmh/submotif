name: Native builds

on:
  pull_request:
    paths: ['plugin/**', '.github/workflows/native-builds.yml', 'docs/BUILDING.md']
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/native-builds.yml', 'docs/BUILDING.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-universal
            runner: macos-15
          - target: windows-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test build orchestration
        run: python plugin/tests/build-tests.py
      - name: Build and test native products
        run: python plugin/scripts/build.py --target ${{ matrix.target }} --jobs 2 --artifact
      # tar preserves executable permissions, symlinks and complete source/notices.
      # These are temporary development artifacts; no Release is created.
      - name: Upload development artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Submotif-${{ matrix.target }}-development
          path: dist/builds/Submotif-${{ matrix.target }}-development.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
