name: Release builds

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 plugin/scripts/release-tag.py --check "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Submotif $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
  build:
    needs: prepare
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-universal
            runner: macos-15
          - target: windows-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate tag and packaging
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python plugin/scripts/release-tag.py --check "$RELEASE_TAG"
          python plugin/tests/package-release-tests.py
      - name: Build and test
        run: python plugin/scripts/build.py --target ${{ matrix.target }} --jobs 2 --artifact
      - name: Package verified release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: python plugin/scripts/package-release.py --target ${{ matrix.target }} --tag "$RELEASE_TAG"
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" dist/releases/"$RELEASE_TAG"/Submotif-${{ matrix.target }}.*
      # Publication is a separate, explicit owner-authorized action after all targets pass.
